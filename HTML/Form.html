<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body>
    <h1><center>Form</center></h1>

<form action="" align="center"  method="get">
   
    <p>  <input type="text" name="user-name" placeholder="User Name" size="40" maxlength="20"></p>

    <p>  <input type="password" name="password" placeholder="password" size="40"></p>

    <textarea name="Comments" placeholder="Comments" id="" cols="40" rows="10"></textarea>

    <p> <input type="submit" value="Log In"></p>


</form>

<br><br><br><hr>

<h1><center><u>Student Application</u></center></h1>

<form method="get" action="" >

    <fieldset>
        <legend><h2>Login Information</h2></legend>

<p><label for="name">Name:</label><br> 
            <input type="text" name="name" size="40" id="name"></p>

<p>
    <label for="email">Email:</label><br>
    <input type="email" size="40" id="email">
</p>      
    </fieldset>


<fieldset>
    <legend><h2>Persional Information</h2></legend>
<p>
    <label for="address">Address:</label><br>
    <textarea name="Address" id="address" cols="40" rows="5"></textarea></p>

<p>
    <label>Gender:</label><br>
    <input type="radio" name="gender" value="Male" checked="checked" id="male"> <label for="male">Male</label>
    <input type="radio" name="gender" value="Female" id="female"> <label for="female">Female</label>
</p>    

<p>
    Date of Birth:
    <input type="date" name="dob">
</p>
</fieldset>

<fieldset>
    <legend><h2>Educational Information</h2></legend>

<p>
    <label>Courses:</label><br>
    <input type="checkbox"
    name="Web Development" id="web-development"><label for="web-development">Web Development</label>

    <input type="checkbox"
    name="Networking Engineering" id="NE"><label for="NE">Networking Engineering</label>

    <input type="checkbox"
    name="AI" id="ai"><label for="ai">AI</label>

    <input type="checkbox"
    name="CS" id="cs"><label for="cs">CS</label>
</p>



<p>
    Cirtificate:
    <input type="file" name="cirtificate">
</p>
</fieldset>


<br>
<input type="submit" name="submit" value="submit">


    


</form>

</body>
</html>
