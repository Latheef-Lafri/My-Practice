<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Field</title>
</head>
<body>
     <h1><center> Form Field Tag</center></h1>

     <form action="">
        <p>
            <label for="Name">Name</label>
            <input type="text" name="name" id="Name">
        </p>

        <p>
            <label for="age">AGE</label>
            <input type="number" name="age" id="age" min="18" max="40">
        </p>


        <p>
<label for="range">Price range</label>
<input type="range" name="range" id="range">
        </p>


 <p>
   <label for="url">Ender The URL</label>
   <input type="url" name="url" id="url">
</p>


 <p>
   <label for="TIME">Class Time</label>
   <input type="time" name="time" id="TIME">
</p>

 <p>
   <label for="TIME">How Many Weeks</label>
   <input type="week" name="time" id="TIME">
</p>

 <p>
   <label for="TIME">search</label>
   <input type="search" name="time" id="TIME">
</p>










        <p>
            
            <input type="submit" name="submit" value="submit">
        </p>


     </form>
</body>
</html>
